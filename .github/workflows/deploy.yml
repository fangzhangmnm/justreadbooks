# 部署 GitHub Pages：prod 分支 → /，main 分支 → /dev/（家族 dev/prod split，抄 WXHW / WeebPaint deploy.yml）
# created 2026-09-19 by Claude Fable 5.1
#
# 各分支自己已经 commit 好构建产物（v2 起 dist/jrb-<hash>.mjs；v1 时代是裸 src/ 直发）。
# 本 workflow 只做「组合两分支 → upload」，不重 build。两种布局都兼容：有什么拷什么。
#
# 第一次 setup（2026-09-19）：prod 分支 = 当时 main 的快照（v23）→ push；Pages source 切成 GitHub Actions。
name: Deploy Pages

on:
  push:
    branches: [main, prod]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true   # main+prod 几乎同 push 时最后一次必赢（WeebPaint v130 坑）

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout prod branch
        uses: actions/checkout@v4
        with:
          ref: prod
          path: prod-tree

      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-tree

      - name: Compose site (prod=/, main=/dev/)
        run: |
          mkdir -p site/dev
          compose() {   # $1 = 源树, $2 = 目标目录
            for f in index.html manifest.webmanifest service-worker.js styles.css \
                     icon.svg icon-192.png icon-512.png apple-touch-icon.png; do
              cp -p "$1/$f" "$2/" 2>/dev/null || echo "::notice::$1 缺 $f（该布局不需要则忽略）"
            done
            # v1 布局 = src/（含 src/vendor/）直发；v2 布局 = vendor/ + dist/ + assets/。有什么拷什么，缺了不算错。
            for d in src vendor dist assets; do
              [ -d "$1/$d" ] && cp -r "$1/$d" "$2/" || true
            done
          }
          compose prod-tree site
          compose main-tree site/dev

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
